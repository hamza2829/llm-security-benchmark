[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-benchmark"
version = "0.1.0"
description = "Offline, synthetic security-control benchmark for a deterministic mock agent"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3", "packaging==26.3"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
llmsec = "llmsec.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["runner"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
