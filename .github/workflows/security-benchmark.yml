name: Security benchmark
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / tests and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned runtime and developer tools
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Run all forty cases against both modes
        run: python -m llmsec run
      - name: Regenerate Markdown and HTML from saved outcomes
        run: python -m llmsec report
      - name: Fail on hardened baseline regression
        run: python -m llmsec compare
      - name: Check published result snapshots
        run: python scripts/verify_snapshot.py artifacts
      - name: Upload executed tests and security evaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-python-${{ matrix.python }}
          path: |
            artifacts/results.json
            artifacts/report.md
            artifacts/report.html
            artifacts/pytest.xml
          if-no-files-found: warn

  static-security:
    name: Gitleaks, pip-audit and Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned scanner CLIs without Docker
        run: |
          python -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/pip" install pip-audit==2.10.1
          python -m venv "$RUNNER_TEMP/semgrep-env"
          "$RUNNER_TEMP/semgrep-env/bin/pip" install semgrep==1.183.0
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir -p artifacts
      - name: Gitleaks full Git history
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --report-format json --report-path artifacts/gitleaks.json'
      - name: pip-audit real pinned runtime requirements
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/audit-env/bin/pip-audit" -r requirements.txt --no-deps --disable-pip --format json --output artifacts/pip-audit.json'
      - name: Semgrep local security rules
        if: ${{ !cancelled() }}
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: '"$RUNNER_TEMP/semgrep-env/bin/semgrep" scan --config .semgrep.yml --error --metrics=off --json --output artifacts/semgrep.json src'
      - name: Upload scanner reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scanners
          path: |
            artifacts/gitleaks.json
            artifacts/pip-audit.json
            artifacts/semgrep.json
          if-no-files-found: warn
